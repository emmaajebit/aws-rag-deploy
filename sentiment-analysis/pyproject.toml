[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentiment-analysis"
version = "1.0.0"
description = "NLP sentiment analysis for e-commerce / food product reviews (classical ML, DL, DistilBERT, API, dashboard)"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
sentiment = "sentiment.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
